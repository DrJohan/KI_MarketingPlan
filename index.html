<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b2d4b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta
      name="description"
      content="Klinik Inocare Sales & Marketing Plan for August–December 2026."
    >
    <title>Klinik Inocare | Sales &amp; Marketing Plan — Aug–Dec 2026</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/reveal.css">
    <link rel="stylesheet" href="plugin/chalkboard/style.css">
    <link rel="stylesheet" href="css/inocare.css">
  </head>
  <body>
    <a class="skip-link" href="#slides">Skip to presentation</a>

    <div class="reveal" aria-label="Klinik Inocare presentation">
      <div class="slides" id="slides"></div>
    </div>

    <div class="deck-tools" data-deck-tools>
      <button
        class="deck-tools__toggle"
        type="button"
        aria-expanded="false"
        aria-controls="deck-tools-menu"
        aria-label="Open presentation tools"
        data-menu-toggle
      >
        <span aria-hidden="true">•••</span>
      </button>

      <div class="deck-tools__menu" id="deck-tools-menu" role="menu" hidden>
        <button type="button" role="menuitem" data-action="overview">Slide overview <kbd>O</kbd></button>
        <button type="button" role="menuitem" data-action="presenter">Presenter view <kbd>S</kbd></button>
        <button type="button" role="menuitem" data-action="search">Search slides <kbd>Ctrl+Shift+F</kbd></button>
        <button type="button" role="menuitem" data-action="fullscreen">Full screen <kbd>F</kbd></button>
        <button type="button" role="menuitem" data-action="chalkboard">Chalkboard <kbd>B</kbd></button>
        <button type="button" role="menuitem" data-action="clear-drawings">Clear drawings <kbd>Del</kbd></button>
        <button type="button" role="menuitem" data-action="print">Print / PDF</button>
        <button type="button" role="menuitem" data-action="restart">Restart deck</button>
      </div>
    </div>

    <div class="deck-toast" role="status" aria-live="polite" data-toast></div>

    <noscript>
      <p class="no-script">JavaScript is required to run this presentation.</p>
    </noscript>

    <script src="js/reveal.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/search.js"></script>
    <script src="js/zoom.js"></script>
    <script src="plugin/chalkboard/plugin.js"></script>
    <script src="js/deck.js"></script>
  </body>
</html>
